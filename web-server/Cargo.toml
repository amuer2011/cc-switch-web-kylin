[package]
name = "web-server"
version = "0.1.0"
edition = "2021"

[dependencies]
cc_switch_lib = { package = "cc-switch", path = "../src-tauri", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
base64 = "0.22"
